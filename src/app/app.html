<div class="app-layout">
  <app-loading-overlay></app-loading-overlay>

  @if (!drawerOpen() && appShellUi.browseButtonVisible()) {
    <button
      type="button"
      class="drawer-toggle-fab"
      (click)="toggleDrawer()"
      [attr.aria-expanded]="drawerOpen()"
      aria-controls="app-drawer"
      aria-label="Open browse panel"
    >
      Browse
    </button>
  }

  @if (drawerOpen()) {
    <button
      type="button"
      class="drawer-backdrop"
      (click)="closeDrawer()"
      aria-label="Close browse panel"
    ></button>
    <aside
      id="app-drawer"
      class="drawer drawer-open"
      aria-hidden="false"
      (click)="$event.stopPropagation()"
    >
      <h1>RAG Console</h1>
      <nav>
        <a routerLink="/browse-gutenberg" routerLinkActive="active" (click)="closeDrawer()">Browse Gutenberg</a>
        <a routerLink="/documents" routerLinkActive="active" (click)="closeDrawer()">Documents</a>
        <a routerLink="/documents2" routerLinkActive="active" (click)="closeDrawer()">Documents2</a>
        <a routerLink="/import" routerLinkActive="active" (click)="closeDrawer()">Import</a>
      </nav>
    </aside>
  }

  <main class="content">
    <router-outlet />
  </main>
</div>
