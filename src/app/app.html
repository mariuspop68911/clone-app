<div class="app-layout">
  <app-loading-overlay></app-loading-overlay>

  @if (!drawerOpen() && appShellUi.browseButtonVisible()) {
    <button
      type="button"
      class="drawer-toggle-fab"
      (click)="toggleDrawer()"
      [attr.aria-expanded]="drawerOpen()"
      aria-controls="app-drawer"
      aria-label="Open browse panel"
    >
      Browse
    </button>
  }

  @if (drawerOpen()) {
    <button
      type="button"
      class="drawer-backdrop"
      (click)="closeDrawer()"
      aria-label="Close browse panel"
    ></button>
  }

  <aside
    id="app-drawer"
    class="drawer"
    [class.drawer-open]="drawerOpen()"
    [attr.aria-hidden]="!drawerOpen()"
    (click)="$event.stopPropagation()"
  >
    <h1>RAG Console</h1>
    <nav>
      <a routerLink="/books" routerLinkActive="active" (click)="closeDrawer()">Search Books</a>
      <a routerLink="/browse" routerLinkActive="active" (click)="closeDrawer()">Browse</a>
      <a routerLink="/documents" routerLinkActive="active" (click)="closeDrawer()">View Documents</a>
    </nav>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
