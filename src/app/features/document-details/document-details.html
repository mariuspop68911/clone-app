<section class="details-page">
  <a class="back" routerLink="/documents">Back to Documents</a>

  <div class="panel">
    <p class="eyebrow">Document Details</p>
    <h1>{{ docKey() }}</h1>

    <div class="actions">
      <button type="button" class="btn-comic" (click)="viewComicSlides()">
        View Final Slides
      </button>
      <button type="button" class="btn-events" (click)="pipeline()">Pipeline</button>
    </div>

    @if (message()) {
      <p class="message">{{ message() }}</p>
    }
  </div>
</section>
