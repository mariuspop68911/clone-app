name: Build And Publish Frontend Container Images

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGION: europe-central2
  STAGING_PROJECT_ID: documentor-staging
  PROD_PROJECT_ID: documentor-production-494707
  STAGING_REPOSITORY_NAME: documentor-container
  PROD_REPOSITORY_NAME: documentor-containers
  FRONTEND_IMAGE_NAME: clone-app

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --watch=false

      - name: Build staging frontend
        run: npm run build -- --configuration=staging

      - name: Build production frontend
        run: npm run build -- --configuration=production

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Compute immutable image tags
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_staging=${REGION}-docker.pkg.dev/${STAGING_PROJECT_ID}/${STAGING_REPOSITORY_NAME}/${FRONTEND_IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "frontend_prod=${REGION}-docker.pkg.dev/${PROD_PROJECT_ID}/${PROD_REPOSITORY_NAME}/${FRONTEND_IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image to staging
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: true
          provenance: false
          build-args: |
            BUILD_CONFIGURATION=staging
          tags: |
            ${{ steps.meta.outputs.frontend_staging }}:${{ steps.meta.outputs.sha_tag }}

      - name: Build and push frontend image to production
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: true
          provenance: false
          build-args: |
            BUILD_CONFIGURATION=production
          tags: |
            ${{ steps.meta.outputs.frontend_prod }}:${{ steps.meta.outputs.sha_tag }}

      - name: Show published image references
        run: |
          echo "Staging frontend: ${{ steps.meta.outputs.frontend_staging }}:${{ steps.meta.outputs.sha_tag }}"
          echo "Prod frontend:    ${{ steps.meta.outputs.frontend_prod }}:${{ steps.meta.outputs.sha_tag }}"
